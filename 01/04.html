    <script>
        /*

        function findLargest(a, b, c) {
            const unsorted = [a, b, c];
            console.log('All the numbers', unsorted);
            const largest = Math.max(a, b, c);
            console.log('Largest number', largest);
        }

        const n1 = 500;
        const n2 = 1000;
        const n3 = 100000;

        findLargest(n1, n2, n3);
