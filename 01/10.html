<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tehtävä 1:10</title>
  </head>

  <body>
    <script>
      /*

Luo HTML-tiedosto, joka sisältää JavaScript-koodin.

Mäkihypyssä käytetään viittä tuomaria.
Kukin heistä antaa hypylle pistemäärän 1-20.
Kirjoita ohjelma, joka kysyy yhden hypyn tyylipisteet
ja tulostaa tyylipisteiden summan siten, että summasta on vähennetty pienimmät
ja suurimmat tyylipisteet.

Käytä JavaScriptin prompt()-funktiota tyylipisteiden kysymiseen.
*/
      const points = [];
      for (let x = 1; x <= 5; x = x + 1) {
        const pointsFromJudge = prompt(`Tuomarin #${x} pisteet`);
        points.push(parseInt(pointsFromJudge, 10));
      }

      const sortedPoints = [...points].sort((a, b) => a - b);

      sortedPoints.pop();
      sortedPoints.shift();

      const sum = sortedPoints.reduce((total, value) => {
        return total + value;
      }, 0);

      console.log("Hyppääjän tyylipisteet", sum);
    </script>
  </body>
</html>
