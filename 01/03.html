<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tehtävä 1:3</title>
  </head>

  <body>
    <script>
      /*

        Luo HTML-tiedosto, joka sisältää JavaScript-koodin.
        Määrittele sovellukseesi taulukko, jossa on seuraavat sanat:
        ["JavaScriptin", "opiskelu", "on", "ihanaa!"].
        Muodosta taulukon sanoista lause käyttämällä toistolausetta.
        Tulosta web-konsolille muodostunut lause.
        */

      const words = ["JavaScriptin", "opiskelu", "on", "ihanaa!"];

      let sentence = "";

      for (let x = 0; x < words.length; x = x + 1) {
        sentence = sentence + words[x];
        if (x < words.length - 1) {
          sentence = sentence + " ";
        }
      }

      console.log(sentence);
    </script>
  </body>
</html>
