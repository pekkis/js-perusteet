<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Tehtävä 2:7</title>

    <link rel="stylesheet" type="text/css" href="./common.css" />

    <script type="module">
      import { elm } from "./functions.js";
      /*

Oletetaan, että Lady Gaga on pitämässä konserttia.
Tee sovellus, joka web-sivun ensimmäisen latauksen jälkeen näyttää
selainikkunassa tekstin OMG - Lady Gaga start singing!.
Tämän jälkeen konsertissa alkaa ilotulitus. Lisää edellisen tekstin alapuolelle viiden sekunnin välein aina uusi
teksti NICE - fireworks!. Voit itse päättää kuinka monta kertaa edellä mainittu teksti lisätään.
Kaikki aiemmin lisätyt tekstit pysyvät näytöllä esimerkkitulostuksen mukaisesti. Lopuksi jonkun ajan kuluttua
(voit itse päättää ajan) edellisten tekstien alapuolelle tulee
lisätä teksti WOW - It was the best concert in my life....

Esimerkkitulostus:

OMG - Lady Gaga start singing!
NICE - fireworks!
NICE - fireworks!
NICE - fireworks!
NICE - fireworks!
WOW - It was the best concert in my life...
      */

      const numberOfFireworks = Math.trunc(Math.random() * 4) + 4;
      let times = 0;

      const intervalLength = 5000;

      const appender = (...contents) => {
        const element = document.querySelector("#concert");

        const node = elm("div")(...contents);

        element.appendChild(node);
      };

      appender("OMG - Lady Gaga start singing!");

      const updateInterval = setInterval(() => {
        appender("NICE - fireworks!");
        times = times + 1;

        if (times >= numberOfFireworks) {
          clearInterval(updateInterval);

          setTimeout(() => {
            appender("WOW - It was the best concert in my life...");
          }, intervalLength);
        }
      }, intervalLength);
    </script>
  </head>

  <body>
    <main class="container">
      <div id="concert" class="stack stack-y stack-gap-1"></div>
    </main>
  </body>
</html>
