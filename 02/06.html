<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Tehtävä 2:6</title>

    <link rel="stylesheet" type="text/css" href="/common.css" />

    <script type="module">
      import { temporalGate } from "/functions.js";
      /*

      Luo web-sivu, joka näyttää ja päivittää päivämäärän
      ja kellonajan. Käytä setInterval-funktiota kutsuaksesi
      itse tekemääsi funktiota. Funktiosi tulee käyttää Date-objektia
      saadakseen tiedon nykyisestä päivämäärästä ja kellonajasta.
      Käytä HTML:n DIV-elementin innerHTML-ominaisuutta näyttääksesi
      uuden päivämäärän ja kellonajan joka sekunti.

      Toim. huom. me käytämme temporalia. Ja emme käytä innerHTMLää koska tietoturva.

      */

      temporalGate();

      const formatter = new Intl.DateTimeFormat("fi-FI", {
        dateStyle: "full",
        timeStyle: "medium",
      });

      const getNow = () => {
        const now = Temporal.Now.zonedDateTimeISO();

        const formatted = formatter.format(now.toInstant().epochMilliseconds);

        const machineReadable = now.toString({ smallestUnit: "second", timeZoneName: "never" });

        return { machineReadable, formatted };
      };

      const updater = (selector, getter) => {
        const { formatted, machineReadable } = getter();
        const element = document.querySelector(selector);
        element.dateTime = machineReadable;
        element.textContent = formatted;
      };

      updater("#time", getNow);
      setInterval(() => {
        updater("#time", getNow);
      }, 1000);
    </script>
  </head>

  <body>
    <main class="container">
      <time datetime="" id="time"></time>
    </main>
  </body>
</html>
