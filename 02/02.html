<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Tehtävä 2:2</title>

    <link rel="stylesheet" type="text/css" href="/common.css" />

    <script type="module">
      /*

      Toteuta HTMLää, CSSää ja JavaScriptiä käyttäen oheisen
      kuvan mukainen kahden luvun yhteenlaskin.
      tulostaSumma(a, b)-funktio ottaa parametrinaan
      lomakkeen kenttiin syötetyt luvut (merkkijonot) ja
      tulostaa lopputuloksen div-elementtiin (id=results).
      tulostaSumma(a, b)-funktio käyttää summan laskemiseen
      laskeSumma(a, b)-funktiota, joka palauttaa (return) summan kokonaislukuna.
      Lomakkeen voit määritellä esim. [esimerkki]

      Kuva: ex0202.ong

*/

      import { elm } from "/functions.js";

      function laskeSumma(a, b) {
        return parseInt(a, 10) + parseInt(b, 10);
      }

      function tulostaSumma(a, b) {
        const sum = laskeSumma(a, b);

        const p = elm("p")("Sum is ", sum);
        document.getElementById("results").replaceChildren(p);
      }

      const form = document.getElementById("form");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);

        const n1 = formData.get("n1");
        const n2 = formData.get("n2");

        tulostaSumma(n1, n2);
      });
    </script>
  </head>

  <body>
    <main class="container">
      <h1>Calculate numbers together</h1>

      <form id="form" action="#">
        <div class="field">
          <label for="n1">Number 1</label>
          <input id="n1" name="n1" type="number" required />
        </div>

        <div class="field">
          <label for="n2">Number 2</label>
          <input id="n2" name="n2" type="number" required />
        </div>

        <div class="field">
          <button type="submit">Calculate Sum</button>
        </div>

        <div id="results"></div>
      </form>
    </main>
  </body>
</html>
