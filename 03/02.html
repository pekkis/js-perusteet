<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Tehtävä 3:2</title>

    <link rel="stylesheet" type="text/css" href="/common.css" />

    <script type="module">
      /*
Lisää person-oliolle uusi ominaisuus address, jonka arvo on Piippukatu 2.
Muokkaa age-ominaisuuden arvoksi 31. Poista isStudent-ominaisuus objektista.
ÄLÄ muuta objektin sisältöä, lisää vain muutama koodirivi edellisen harjoituksen jälkeen.

Käy läpi henkilön objektin ominaisuudet for...in-silmukalla ja näytä jokainen ominaisuus ja arvo;

firstName: Kirsi
lastName: Kernell
age: 31
address: Piippukatu 2

      */

      const person = {
        firstName: "Kirsi",
        lastName: "Kernell",
        age: 30,
        isStudent: false,
      };

      console.log(person.firstName);
      console.log(person.lastName);
      console.log(person.age);
      console.log(person.isStudent);

      person.age = 31;
      person.address = "Piippukatu 2";

      delete person.isStudent;

      /*
      OBS! I would NEVER use for...in in real life code because of the
      prototype chain issues. Used here because asked specifically.
      */
      for (const property in person) {
        console.log(`${property}:`, person[property]);
      }
    </script>
  </head>

  <body>
    Tässä tehtävässä kaikki kiinnostava on konsolissa!
  </body>
</html>
