<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Tehtävä 3:9</title>

    <link rel="stylesheet" type="text/css" href="/common.css" />
    <link rel="stylesheet" type="text/css" href="./09.css" />

    <script type="module">
      /*
      Luo web-sivu, joka simuloi hissiä. Hississä on
      näyttö, jossa näkyy haluttu kerros. Hissi näyttää, missä se on
      ja milloin se siirtyy johonkin kerrokseen. Hississä on
      muutama painike, joilla sitä voi käyttää (katso alla oleva video).

      Vaatimuksia:

      HTML-tiedosto käyttää ulkoisia CSS- ja JavaScript-tiedostoja
      Käytä oliopohjaista ohjelmointia Elevator-luokan avulla.
      Käyttäjä voi painaa painikkeita määrittääkseen halutun uuden kerroksen.
      Uusi haluttu kerros näkyy näytöllä
      Hissi voi kulkea vain kerroksiin 1-100.
      Hissin näytöllä näytetään, mihin kerrokseen käyttäjä yrittää siirtyä.
      Hissi ei voi vaihtaa haluttua kerrosta, kun se liikkuu.
      Hissi näyttää Elevator is now going to floor: X -viestiä, kun se liikkuu
      Hissin näyttää Elevator is now in floor: X , kun se on jossakin kerroksessa
      */
    </script>
    <script type="module" src="./09.js"></script>
  </head>

  <body>
    <main class="container-elevator">
      <div class="elevator">
        <div class="grid">
          <div id="display" class="display">&nbsp;</div>

          <div id="info" class="info">Info text goes here</div>

          <button data-number="1">1</button>
          <button data-number="2">2</button>
          <button data-number="3">3</button>

          <button data-number="4">4</button>
          <button data-number="5">5</button>
          <button data-number="6">6</button>

          <button data-number="7">7</button>
          <button data-number="8">8</button>
          <button data-number="9">9</button>

          <button data-action="clear">C</button>
          <button data-number="0">0</button>
          <button data-action="go">GO</button>
        </div>
      </div>
    </main>
  </body>
</html>
